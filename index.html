<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Follower Goal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .follower-goal-container {
            background: transparent;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
        }
        
        .follower-goal-text {
            font-size: 24px;
            font-weight: 600;
            color: #9146FF;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .follower-count {
            font-weight: 700;
        }
        
        .goal-count {
            color: #ffffff;
            font-weight: 700;
        }
        
        .loading {
            color: #aaa;
            font-style: italic;
        }
        
        .error {
            color: #ff4444;
        }
        
        .channel-name {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="follower-goal-container">
        <p class="follower-goal-text">
            Followers goal: <span class="follower-count">0</span>/<span class="goal-count">200</span>
        </p>
        <p class="channel-display" style="display: none;">
            Tracking: <span class="channel-name">channel</span>
        </p>
    </div>

    <script>
        // Get channel name from URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Get channel from URL or use default
        const TWITCH_CHANNEL = getUrlParameter('channel') || 'shroud'; // Default channel
        const GOAL_COUNT = getUrlParameter('goal') || 200; // Default goal

        // Update display to show which channel we're tracking
        const channelDisplay = document.querySelector('.channel-display');
        const channelNameElement = document.querySelector('.channel-name');
        
        if (TWITCH_CHANNEL) {
            channelNameElement.textContent = TWITCH_CHANNEL;
            channelDisplay.style.display = 'block';
        }

        const followerCountElement = document.querySelector('.follower-count');
        const goalCountElement = document.querySelector('.goal-count');
        
        // Set the goal count
        goalCountElement.textContent = GOAL_COUNT;
        
        let currentFollowerCount = 0;
        
        // Method 1: Using Twitch API
        async function fetchFollowerCount() {
            try {
                console.log(`Fetching followers for: ${TWITCH_CHANNEL}`);
                const response = await fetch(`https://api.twitch.tv/helix/users?login=${TWITCH_CHANNEL}`, {
                    headers: {
                        'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko',
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Twitch API failed');
                }
                
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    const userId = data.data[0].id;
                    await fetchFollowerCountByUserId(userId);
                } else {
                    throw new Error('User not found');
                }
                
            } catch (error) {
                console.log('Method 1 failed, trying Method 2...');
                await fetchFollowerCountAlternative();
            }
        }
        
        async function fetchFollowerCountByUserId(userId) {
            try {
                const response = await fetch(`https://api.twitch.tv/helix/users/follows?to_id=${userId}&first=1`, {
                    headers: {
                        'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko'
                    }
                });
                
                if (!response.ok) throw new Error('Follow count API failed');
                
                const data = await response.json();
                updateFollowerCount(data.total);
                
            } catch (error) {
                console.log('Twitch follow API failed, trying alternative...');
                await fetchFollowerCountAlternative();
            }
        }
        
        // Method 2: Alternative API
        async function fetchFollowerCountAlternative() {
            try {
                const response = await fetch(`https://twitch-follower-counter.vercel.app/api/followers?channel=${TWITCH_CHANNEL}`);
                
                if (!response.ok) throw new Error('Alternative API failed');
                
                const data = await response.json();
                
                if (data.followers) {
                    updateFollowerCount(data.followers);
                } else {
                    throw new Error('No follower data');
                }
                
            } catch (error) {
                console.log('Method 2 failed, trying Method 3...');
                await fetchFollowerCountFallback();
            }
        }
        
        // Method 3: Fallback API
        async function fetchFollowerCountFallback() {
            try {
                const response = await fetch(`https://twitch-api.zerody.one/api/followers?username=${TWITCH_CHANNEL}`);
                
                if (!response.ok) throw new Error('Fallback API failed');
                
                const data = await response.json();
                
                if (data.followerCount !== undefined) {
                    updateFollowerCount(data.followerCount);
                } else {
                    throw new Error('All methods failed');
                }
                
            } catch (error) {
                console.error('All API methods failed:', error);
                followerCountElement.textContent = 'Error';
                followerCountElement.classList.add('error');
            }
        }
        
        function updateFollowerCount(count) {
            if (count !== currentFollowerCount) {
                currentFollowerCount = count;
                followerCountElement.textContent = count.toLocaleString();
                followerCountElement.classList.remove('loading', 'error');
                
                // Animation for new follower
                if (count > parseInt(followerCountElement.dataset.lastCount || 0)) {
                    followerCountElement.style.transform = 'scale(1.3)';
                    followerCountElement.style.color = '#00ff00';
                    setTimeout(() => {
                        followerCountElement.style.transform = 'scale(1)';
                        followerCountElement.style.color = '#9146FF';
                    }, 500);
                }
                
                followerCountElement.dataset.lastCount = count;
            }
        }
        
        // Initialize
        function init() {
            followerCountElement.textContent = 'Loading...';
            followerCountElement.classList.add('loading');
            
            // Start fetching
            fetchFollowerCount();
            
            // Update every 30 seconds
            setInterval(fetchFollowerCount, 30000);
            
            // More frequent checks (every 5 seconds)
            setInterval(fetchFollowerCount, 5000);
        }
        
        // Start the widget
        init();
    </script>
</body>
</html>
