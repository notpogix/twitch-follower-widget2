<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Follower Goal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .follower-goal-container {
            background: transparent;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
        }
        
        .follower-goal-text {
            font-size: 24px;
            font-weight: 600;
            color: #9146FF;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .follower-count {
            font-weight: 700;
        }
        
        .goal-count {
            color: #ffffff;
            font-weight: 700;
        }
        
        .loading {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="follower-goal-container">
        <p class="follower-goal-text">
            Followers goal: <span class="follower-count">0</span>/<span class="goal-count">200</span>
        </p>
    </div>

    <script>
        // Configuration
        const TWITCH_USERNAME = 'YOUR_TWITCH_USERNAME'; // CHANGE THIS
        const GOAL_COUNT = 200;
        const UPDATE_INTERVAL = 10000; // Check every 10 seconds
        
        // DOM elements
        const followerCountElement = document.querySelector('.follower-count');
        const goalCountElement = document.querySelector('.goal-count');
        
        // Set the goal count
        goalCountElement.textContent = GOAL_COUNT;
        
        let currentFollowerCount = 0;
        
        // Function to fetch follower count from Twitch API
        async function fetchFollowerCount() {
            try {
                // Using a CORS proxy to avoid CORS issues on GitHub Pages
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const apiUrl = `https://twitchtracker.com/api/channels/summary/${TWITCH_USERNAME}`;
                
                const response = await fetch(proxyUrl + encodeURIComponent(apiUrl));
                const data = await response.json();
                
                if (data.followers) {
                    updateFollowerCount(data.followers);
                } else {
                    throw new Error('No follower data found');
                }
                
            } catch (error) {
                console.error('Error fetching follower count:', error);
                // Fallback: Try alternative method
                try {
                    await fetchFollowerCountAlternative();
                } catch (fallbackError) {
                    console.error('Fallback also failed:', fallbackError);
                    followerCountElement.textContent = 'Error';
                }
            }
        }
        
        // Alternative method using different API
        async function fetchFollowerCountAlternative() {
            const response = await fetch(`https://twitch-follower-counter.vercel.app/api/followers?channel=${TWITCH_USERNAME}`);
            const data = await response.json();
            
            if (data.followers) {
                updateFollowerCount(data.followers);
            } else {
                throw new Error('Alternative API failed');
            }
        }
        
        // Function to update the follower count display
        function updateFollowerCount(count) {
            if (count !== currentFollowerCount) {
                currentFollowerCount = count;
                followerCountElement.textContent = count;
                followerCountElement.classList.remove('loading');
                
                // Add animation for new follower
                if (count > parseInt(followerCountElement.textContent) || followerCountElement.textContent === 'Loading...') {
                    followerCountElement.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        followerCountElement.style.transform = 'scale(1)';
                    }, 300);
                }
            }
        }
        
        // Initialize
        followerCountElement.textContent = 'Loading...';
        followerCountElement.classList.add('loading');
        
        // Start periodic updates
        fetchFollowerCount();
        setInterval(fetchFollowerCount, UPDATE_INTERVAL);
        
        // More frequent checks (every 2 seconds) for better "real-time" feel
        setInterval(fetchFollowerCount, 2000);
    </script>
</body>
</html>
